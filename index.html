<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Text Saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        /* ซ่อน Scrollbar ของตัวรายการเพื่อความคลีนแบบแอปมือถือ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between max-w-md mx-auto bg-slate-900 shadow-2xl">

    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-sky-400"><i class="fa-solid fa-box-archive mr-2"></i>คลังบันทึกข้อความ</h1>
        <span id="item-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-400">0 รายการ</span>
    </header>

    <main id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-32">
        </main>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800/95 backdrop-blur-md border-t border-slate-700 p-4 pb-6">
        <div class="flex gap-2">
            <input type="text" id="text-input" placeholder="พิมพ์หรือวางข้อความที่นี่..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 text-base">
            <button onclick="saveText()" 
                class="bg-sky-500 hover:bg-sky-600 active:scale-95 transition-all text-slate-950 font-bold px-5 rounded-xl flex items-center justify-center text-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-circle-check mr-1"></i> คัดลอกแล้ว!
    </div>

    <script>
        // ดึงข้อมูลเก่าที่เคยเซฟไว้ในเครื่องมาแสดงผล
        let savedTexts = JSON.parse(localStorage.getItem('quick_saved_texts')) || [];

        function renderDisplay() {
            const container = document.getElementById('list-container');
            const countBadge = document.getElementById('item-count');
            container.innerHTML = '';
            
            countBadge.innerText = `${savedTexts.length} รายการ`;

            if (savedTexts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-regular fa-clipboard text-4xl mb-3 block"></i>
                        <p class

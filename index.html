<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Text Saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between max-w-md mx-auto bg-slate-900 shadow-2xl">

    <div class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-10">
        <header class="p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-sky-400"><i class="fa-solid fa-box-archive mr-2"></i>คลังบันทึกข้อความ</h1>
            <span id="item-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-400">0 รายการ</span>
        </header>

        <div class="flex border-t border-slate-700/60 text-center font-medium text-sm">
            <button onclick="switchTab('general')" id="tab-general" class="flex-1 py-3 border-b-2 border-sky-500 text-sky-400 transition-all">
                <i class="fa-regular fa-file-lines mr-1.5"></i>บันทึกทั่วไป
            </button>
            <button onclick="switchTab('account')" id="tab-account" class="flex-1 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all">
                <i class="fa-solid fa-wallet mr-1.5"></i>บัญชี
            </button>
        </div>
    </div>

    <main id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-32">
        </main>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800/95 backdrop-blur-md border-t border-slate-700 p-4 pb-6">
        <div class="flex gap-2">
            <input type="text" id="text-input" placeholder="พิมพ์หรือวางข้อความที่นี่..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 text-base">
            <button onclick="saveText()" 
                class="bg-sky-500 hover:bg-sky-600 active:scale-95 transition-all text-slate-950 font-bold px-5 rounded-xl flex items-center justify-center text-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="toast" class="fixed top-28 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-circle-check mr-1"></i> คัดลอกแล้ว!
    </div>

    <script>
        // แยกแท็บสถานะปัจจุบัน (general = บันทึกทั่วไป, account = บัญชี)
        let currentTab = 'general';
        
        // แยก Object จัดเก็บข้อมูลออกจากกันชัดเจน
        let dataStore = {
            general: JSON.parse(localStorage.getItem('quick_saved_texts')) || [],
            account: JSON.parse(localStorage.getItem('account_saved_texts')) || []
        };

        function renderDisplay() {
            const container = document.getElementById('list-container');
            const countBadge = document.getElementById('item-count');
            container.innerHTML = '';
            
            // ดึงข้อมูลตามแท็บที่เลือกอยู่ปัจจุบัน
            const currentList = dataStore[currentTab];
            countBadge.innerText = `${currentList.length} รายการ`;

            if (currentList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-regular fa-clipboard text-4xl mb-3 block"></i>
                        <p class="text-sm">ไม่มีข้อมูลในแท็บนี้ค่ะ</p>
                    </div>
                `;
                return;
            }

            // แสดงรายการจากใหม่ไปเก่า
            for (let i = currentList.length - 1; i >= 0; i--) {
                const itemText = currentList[i];
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700/50 rounded-xl p-4 flex justify-between items-start gap-3 shadow-md";
                
                card.innerHTML = `
                    <div class="flex-1 break-words pr-2 text-base text-slate-100 select-all"></div>
                    <div class="flex gap-1 items-center shrink-0">
                        <button class="copy-btn p-2.5 text-sky-400 hover:text-sky-300 active:scale-90 transition-all bg-slate-900 rounded-lg">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                        <button class="delete-btn p-2.5 text-slate-500 hover:text-rose-400 active:scale-90 transition-all">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;

                card.querySelector('.flex-1').textContent = itemText;

                // เหตุการณ์กดก๊อปปี้
                card.querySelector('.copy-btn').addEventListener('click', function() {
                    navigator.clipboard.writeText(itemText).then(() => {
                        showToast();
                    });
                });

                // เหตุการณ์กดลบ
                card.querySelector('.delete-btn').addEventListener('click', function() {
                    if (confirm('คุณพี่ลีดต้องการลบข้อความนี้ใช่ไหมคะ?')) {
                        currentList.splice(i, 1);
                        // เซฟแยกตามคีย์ของแท็บตัวเอง
                        const storageKey = currentTab === 'general' ? 'quick_saved_texts' : 'account_saved_texts';
                        localStorage.setItem(storageKey, JSON.stringify(currentList));
                        renderDisplay();
                    }
                });

                container.appendChild(card);
            }
        }

        // ฟังก์ชันสลับแท็บไปมา
        function switchTab(tabName) {
            currentTab = tabName;
            
            const btnGeneral = document.getElementById('tab-general');
            const btnAccount = document.getElementById('tab-account');
            
            if (tabName === 'general') {
                btnGeneral.className = "flex-1 py-3 border-b-2 border-sky-500 text-sky-400 transition-all";
                btnAccount.className = "flex-1 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
            } else {
                btnAccount.className = "flex-1 py-3 border-b-2 border-sky-500 text-sky-400 transition-all";
                btnGeneral.className = "flex-1 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
            }
            
            renderDisplay();
        }

        // ฟังก์ชันสั่งเซฟข้อความ
        function saveText() {
            const input = document.getElementById('text-input');
            const val = input.value.trim();
            if (!val) return;

            dataStore[currentTab].push(val);
            
            // เลือกเซฟลงพื้นที่ตามแท็บที่เปิดใช้งานอยู่
            const storageKey = currentTab === 'general' ? 'quick_saved_texts' : 'account_saved_texts';
            localStorage.setItem(storageKey, JSON.stringify(dataStore[currentTab]));
            
            input.value = '';
            renderDisplay();
            document.getElementById('list-container').scrollTop = 0;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1500);
        }

        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveText();
        });

        renderDisplay();
    </script>
</body>
</html>
